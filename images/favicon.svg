<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matches site dark theme #0d1117 / #161b22) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>

    <!-- Electric Accent Gradient (Matches site #58a6ff / #79c0ff) -->
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Soft Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#58a6ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Gamepad Body & Components -->
  <g transform="translate(28, 28) scale(19)" filter="url(#glow)">
    <!-- Controller Silhouette -->
    <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
          fill="url(#ctrlGrad)"/>

    <!-- Left D-Pad Cross Cutout -->
    <rect x="6.3" y="9.8" width="3.4" height="1.4" rx="0.4" fill="#0b0f17"/>
    <rect x="7.3" y="8.8" width="1.4" height="3.4" rx="0.4" fill="#0b0f17"/>

    <!-- Center Code Brackets </> Cutout -->
    <path d="M 11.0 9.6 L 10.2 10.5 L 11.0 11.4" stroke="#0b0f17" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 13.0 9.6 L 13.8 10.5 L 13.0 11.4" stroke="#0b0f17" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="12.4" y1="9.3" x2="11.6" y2="11.7" stroke="#0b0f17" stroke-width="0.75" stroke-linecap="round"/>

    <!-- Right Action Buttons (Diamond layout: Green, Red, Amber/Gold, Purple) -->
    <circle cx="16.0" cy="9.1" r="0.7" fill="#7ee787"/>
    <circle cx="17.4" cy="10.5" r="0.7" fill="#ff7b72"/>
    <circle cx="16.0" cy="11.9" r="0.7" fill="#f2cc60"/>
    <circle cx="14.6" cy="10.5" r="0.7" fill="#d2a8ff"/>
  </g>
</svg>
